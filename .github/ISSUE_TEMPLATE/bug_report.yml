name: Bug report
description: Something in Conversation Tree does not behave as described.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep it to what you can actually observe — logs and screenshots help a lot.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The version installed (`dsh plugin --profile web list` or `package.json`).
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version and platform
      placeholder: "0.2.1-rc.3, macOS 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the band with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
      description: Drag images here. Please redact anything private from conversation titles or paths.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The band shows a "temporarily unavailable" notice (product DOM change) rather than covering the conversation column.
          required: false
        - label: I restarted DSH after installing/updating.
          required: false
